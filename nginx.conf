server {
    listen 80;
    server_name localhost;

    # 1. Route API requests directly to FastAPI
    location /api {
        proxy_pass http://aps-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Optional: Route FastAPI interactive docs so you can still read them
    location /docs {
        proxy_pass http://aps-backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://aps-backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 3. Route everything else to the React Static Frontend
    location / {
        proxy_pass http://aps-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}