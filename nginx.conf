server {
    listen 80;
    server_name localhost;

    # 1. Route API requests to FastAPI backend
    location /api/v1/ {
        proxy_pass http://aps-backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Route scheduler endpoint
    location /run_scheduler {
        proxy_pass http://aps-backend:8000/run_scheduler;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Route documentation
    location /docs {
        proxy_pass http://aps-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Route OpenAPI schema
    location /openapi.json {
        proxy_pass http://aps-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Route Swagger UI assets
    location ~ ^/(swagger-ui|redoc) {
        proxy_pass http://aps-backend:8000;
        proxy_set_header Host $host;
    }

    # 6. Route static frontend assets
    location / {
        proxy_pass http://aps-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}