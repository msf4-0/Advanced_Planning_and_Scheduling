server {
    listen 80;
    server_name localhost;

    # 1. Route standard API requests to your FastAPI backend
    location /api/ {
        proxy_pass http://aps-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. FIX: Route the main documentation dashboard
    location /docs {
        proxy_pass http://aps-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. FIX: Route the interactive structural OpenAPI schema JSON profile
    location /openapi.json {
        proxy_pass http://aps-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. CRITICAL FIX: Route the missing static UI script assets required to paint the screen
    location /sb-assets/ {
        proxy_pass http://aps-backend:8000/sb-assets/;
        proxy_set_header Host $host;
    }

    # Fallback to catch alternative default CDN locations
    location ~ ^/(swagger-ui|redoc) {
        proxy_pass http://aps-backend:8000;
        proxy_set_header Host $host;
    }

    # 5. Route web asset requests down to the static frontend container
    location / {
        proxy_pass http://aps-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
