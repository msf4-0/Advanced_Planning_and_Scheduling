[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["aps_backend/tests"]
pythonpath = ["aps_backend"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "aps-frontend/node_modules",
    "aps-frontend/dist",
]

[tool.ruff.lint]
# Start with correctness rules; expand to style rules as the legacy modules are
# replaced in Phases 1-4.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["aps_backend"]
exclude = ["aps_backend/tests"]

# Legacy modules predate typed boundaries. They are ignored until the Phase 1-2
# domain/port extraction; new code under app/ is checked without overrides.
[[tool.mypy.overrides]]
module = ["classes.*", "repository.*", "api.*", "app.main"]
ignore_errors = true

[tool.coverage.run]
source = [
    "aps_backend/classes",
    "aps_backend/repository",
    "aps_backend/api",
]
branch = true
omit = ["aps_backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = ["app", "api", "classes", "repository"]

[[tool.importlinter.contracts]]
name = "Domain has no infrastructure or delivery dependencies"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.adapters",
    "app.config",
    "app.main",
    "api",
    "classes",
    "repository",
]

[[tool.importlinter.contracts]]
name = "Persistence and legacy engine have no delivery dependencies"
type = "forbidden"
source_modules = ["repository", "classes"]
forbidden_modules = ["api", "app.main"]
